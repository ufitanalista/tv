<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convênios UFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Painel de convênios: filtros no topo (unidade, período, busca), números do período, abas (Avisos · Convênios ativos · Vendas por convênio)
   com visão Rede ou Por unidade, e a ficha do convênio ao clicar. Versão anterior: convenios-anterior.html. */
:root {
  --bg: #f3f2ee; --surface: #ffffff; --surface-2: #f8f7f3; --ink: #17171a; --muted: #5d5c57; --line: #dddbd3;
  --brand: #ffcf00; --brand-ink: #17171a; --brand-soft: #fff4c2;
  --bar: #b07d00; --bar-ativa: #17171a;
  --ok: #1d7a46; --ok-soft: #e3f3e9; --warn: #9a5b00; --warn-soft: #fff1d6; --crit: #b42318; --crit-soft: #fde8e6;
  --info: #1f5fa8; --info-soft: #e4eefa;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121214; --surface: #1c1c20; --surface-2: #232328; --ink: #f1efe8; --muted: #a6a49c; --line: #2f2f35;
    --brand: #ffd21a; --brand-ink: #121214; --brand-soft: #3a3210; --bar: #e0b100; --bar-ativa: #f1efe8;
    --ok: #5fcf8d; --ok-soft: #173324; --warn: #f2b45a; --warn-soft: #3a2a10; --crit: #ff8a7f; --crit-soft: #3d1a17;
    --info: #8db8ec; --info-soft: #172638;
  }
}
:root[data-theme="dark"] {
  --bg: #121214; --surface: #1c1c20; --surface-2: #232328; --ink: #f1efe8; --muted: #a6a49c; --line: #2f2f35;
  --brand: #ffd21a; --brand-ink: #121214; --brand-soft: #3a3210; --bar: #e0b100; --bar-ativa: #f1efe8;
  --ok: #5fcf8d; --ok-soft: #173324; --warn: #f2b45a; --warn-soft: #3a2a10; --crit: #ff8a7f; --crit-soft: #3d1a17;
  --info: #8db8ec; --info-soft: #172638;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 15px/1.4 var(--body); }
.num { font-variant-numeric: tabular-nums; }
header { background: #17171a; color: #f3f2ee; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
header img { height: 38px; }
header h1 { font: 800 30px/1 var(--display); margin: 0; letter-spacing: .3px; }
header h1 span { color: var(--brand); }
.filtros { margin-left: auto; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
select, input[type=search], input[type=date] { font: 600 15px var(--body); padding: 8px 12px; border-radius: 8px; border: 1px solid #3a3a40; background: #26262b; color: #f3f2ee; min-width: 0; color-scheme: dark; }
input[type=search] { width: 240px; }
.datas { display: flex; gap: 6px; align-items: center; font-size: 13px; color: #a6a49c; }
.datas[hidden] { display: none; }
.atualizado { font-size: 13px; color: #a6a49c; }
main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 40px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--brand); border-radius: 12px; padding: 14px 18px; }
.kpi .rot { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
.kpi .val { font: 800 44px/1.05 var(--display); margin-top: 4px; }
.kpi .sub { font-size: 14px; color: var(--muted); }
.kpi.alerta { border-top-color: var(--crit); }
.abas { display: flex; gap: 6px; margin: 22px 0 14px; border-bottom: 2px solid var(--line); overflow-x: auto; overflow-y: hidden; }
.abas button { font: 700 22px var(--display); background: none; border: 0; color: var(--muted); padding: 8px 16px; cursor: pointer; border-bottom: 4px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.abas button.ativa { color: var(--ink); border-bottom-color: var(--brand); }
.abas .qtd { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--crit); color: #fff; font: 700 14px/22px var(--body); text-align: center; vertical-align: 3px; }
.barra-topo { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
.barra-topo .nota { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { font: 700 14px var(--body); border: 0; background: none; color: var(--muted); padding: 8px 16px; cursor: pointer; }
.seg button.ativa { background: var(--ink); color: var(--bg); }
.cartao { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; min-width: 0; }
.cartao h2 { font: 800 24px var(--display); margin: 0 0 10px; }
.cartao h2 small { font: 500 14px var(--body); color: var(--muted); margin-left: 8px; }
.tabela { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; user-select: none; position: sticky; top: 0; background: var(--surface); }
th[data-campo]:not([data-campo=""]) { cursor: pointer; }
th.n, td.n { text-align: right; }
tbody tr.clica, tbody tr.abre { cursor: pointer; }
tbody tr.clica:hover, tbody tr.abre:hover { background: var(--brand-soft); }
tbody tr.aberta { background: var(--brand-soft); }
tr.sub > td { background: var(--surface-2); padding: 12px 14px 16px; white-space: normal; }
tr.sub table th { background: var(--surface-2); }
td.quebra { white-space: normal; min-width: 180px; color: var(--muted); font-size: 13px; }
.seta { display: inline-block; width: 14px; color: var(--muted); }
.selo { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.selo.parado, .selo.saiu { background: var(--crit-soft); color: var(--crit); }
.selo.ok { background: var(--ok-soft); color: var(--ok); }
.selo.pre { background: var(--info-soft); color: var(--info); }
.selo.emp { background: var(--brand-soft); color: var(--ink); border: 1px solid var(--bar); font-weight: 700; margin-left: 6px; }
.selo.emp.parcial { border-style: dashed; }
tbody tr.comemp > td:first-child { box-shadow: inset 4px 0 0 var(--bar); }
.grade2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.vazio { color: var(--muted); padding: 18px 0; text-align: center; }
.barra-mini { display: inline-block; height: 8px; border-radius: 0 4px 4px 0; background: var(--bar); vertical-align: middle; margin-right: 8px; }
/* gráfico de barras por mês */
.grafico { display: flex; align-items: flex-end; gap: 2px; height: 220px; padding-top: 22px; position: relative; }
.grafico .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; cursor: pointer; position: relative; }
.grafico .col .b { width: 70%; max-width: 46px; background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .45; }
.grafico .col.ativa .b, .grafico .col:hover .b { opacity: 1; }
.grafico .col.ativa .b { background: var(--bar-ativa); }
.grafico .col .v { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.grafico .col .m { font-size: 12px; color: var(--muted); margin-top: 6px; height: 16px; }
.base { border-top: 1px solid var(--line); }
.dica { position: fixed; pointer-events: none; background: #17171a; color: #f3f2ee; font-size: 13px; padding: 6px 10px; border-radius: 6px; display: none; z-index: 9; }
.ficha-topo { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 12px; }
.ficha-topo h2 { font: 800 34px var(--display); margin: 0; }
.botao { font: 700 14px var(--body); padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.botao.prim { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.botao.peq { padding: 5px 10px; font-size: 13px; }
.nota { font-size: 13px; color: var(--muted); margin-top: 8px; }
.aviso { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 12px 16px; font-weight: 600; margin-bottom: 14px; }
/* quadro de avisos */
.avisos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.av { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--muted); border-radius: 12px; padding: 14px 18px; min-width: 0; }
.av.crit { border-left-color: var(--crit); } .av.warn { border-left-color: var(--warn); } .av.ok { border-left-color: var(--ok); } .av.info { border-left-color: var(--info); }
.av-topo { display: flex; align-items: baseline; gap: 12px; }
.av-topo .val { font: 800 40px/1 var(--display); }
.av.crit .val { color: var(--crit); } .av.warn .val { color: var(--warn); } .av.ok .val { color: var(--ok); } .av.info .val { color: var(--info); }
.av h3 { font: 800 22px/1.1 var(--display); margin: 0; }
.av .fazer { font-size: 14px; margin: 8px 0 10px; color: var(--muted); }
.av .fazer b { color: var(--ink); }
.av ul { list-style: none; margin: 0; padding: 0; }
.av li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
.av li.clica { cursor: pointer; }
.av li.clica:hover { color: var(--bar); }
.av li span:last-child { color: var(--muted); text-align: right; }
.av .mais { font-size: 13px; color: var(--muted); padding-top: 6px; }
@media (max-width: 900px) {
  header, main { padding-left: 16px; padding-right: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grade2, .avisos { grid-template-columns: 1fr; }
  .filtros { margin-left: 0; width: 100%; }
  input[type=search] { flex: 1; width: auto; }
  .kpi .val { font-size: 34px; }
}
</style>
<body>
<header>
  <img src="logo_ufit.png" alt="UFit">
  <h1>Painel de <span>Convênios</span></h1>
  <div class="filtros">
    <select id="f-unidade" aria-label="Unidade"><option value="">Rede (todas as unidades)</option></select>
    <select id="f-periodo" aria-label="Período"></select>
    <select id="f-empresa" aria-label="Empresa de convênio"><option value="">Todos os convênios</option><option value="com">Só ligados a empresa 🏢</option><option value="sem">Sem empresa ligada</option></select>
    <span class="datas" id="f-datas" hidden>de <input type="date" id="f-de" aria-label="De"> até <input type="date" id="f-ate" aria-label="Até"></span>
    <input id="f-busca" type="search" placeholder="Buscar convênio ou aluno…" aria-label="Buscar">
    <span class="atualizado" id="atualizado"></span>
  </div>
</header>
<main>
  <div id="aviso"></div>
  <section class="kpis" id="kpis"></section>
  <nav class="abas" id="abas">
    <button data-aba="avisos">Avisos</button>
    <button data-aba="ativos" class="ativa">Convênios ativos</button>
    <button data-aba="vendas">Vendas por convênio</button>
    <button data-aba="ficha" id="aba-ficha" hidden>Ficha</button>
  </nav>
  <section id="conteudo"></section>
</main>
<div class="dica" id="dica"></div>
<script src="cripto.js" data-arquivo="conv.enc" data-var="CONV"></script>
<script type="text/plain" class="app">
(function () {
  var D = window.CONV;
  var $ = function (id) { return document.getElementById(id); };
  if (!D) {
    $('aviso').innerHTML = '<div class="aviso">Os dados dos convênios ainda estão carregando (na 1ª vez o servidor lê 13 meses de vendas). A página tenta de novo em 1 minuto.</div>';
    setTimeout(function () { location.reload(); }, 60000);
    return;
  }
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var MESES_LONGOS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  var hoje = new Date(D.atualizadoEm);
  var hojeISO = D.atualizadoEm.slice(0, 10);
  var mesAtual = hojeISO.slice(0, 7);
  var desde = D.historicoDesde || hojeISO;
  var est = { aba: 'ativos', visao: 'rede', unidade: '', empresa: '', busca: '', conv: null, aberto: null,
              per: 'm:' + mesAtual, de: mesAtual + '-01', ate: hojeISO, ord: { campo: 'alunos', desc: true } };

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n(v) { return (v || 0).toLocaleString('pt-BR'); }
  function pct(a, b) { return b ? Math.round(a / b * 100) + '%' : '–'; }
  function reais(v) { return 'R$ ' + (v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dt(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '–'; }
  function nomeMes(ym, ano) { var m = MESES[+ym.slice(5, 7) - 1]; return ano ? m + '/' + ym.slice(2, 4) : m; }
  function dias(s) { return s ? Math.floor((hoje - new Date(s + 'T12:00:00')) / 864e5) : null; }
  function norm(s) { return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function somaDias(s, k) { var d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + k); return iso(d); }
  function fimMes(ym) { return iso(new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0)); }
  function nomeConv(k) { return (D.convenios[k] || {}).nome || k; }
  // true = ainda ativo · false = saiu · null = unidade em pré-venda (ainda não começou)
  function ativoHoje(v) { return v.ativo !== undefined ? v.ativo : !!idsAtivos[v.m]; }
  function saiu(v) { return ativoHoje(v) === false; }

  var hora = new Date(D.atualizadoEm);
  $('atualizado').textContent = 'Atualizado ' + dt(hojeISO) + ' às ' + String(hora.getHours()).padStart(2, '0') + ':' + String(hora.getMinutes()).padStart(2, '0');

  var idsAtivos = {};
  D.alunos.forEach(function (a) { idsAtivos[a.id] = 1; });
  var unidades = {};
  D.alunos.forEach(function (a) { unidades[a.unidade] = 1; });
  D.vendas.forEach(function (v) { unidades[v.unidade] = 1; });
  Object.keys(unidades).sort(function (a, b) { return a.localeCompare(b, 'pt-BR'); }).forEach(function (u) {
    var o = document.createElement('option'); o.value = o.textContent = u; $('f-unidade').appendChild(o);
  });

  // meses com dados, do mais antigo para o atual (gráfico)
  var meses = [];
  for (var d0 = new Date(+desde.slice(0, 4), +desde.slice(5, 7) - 1, 1); iso(d0).slice(0, 7) <= mesAtual; d0.setMonth(d0.getMonth() + 1)) meses.push(iso(d0).slice(0, 7));

  // ---------- período
  (function montarPeriodos() {
    var h = '<optgroup label="Mês a mês">';
    meses.slice().reverse().forEach(function (m) {
      h += '<option value="m:' + m + '">' + MESES_LONGOS[+m.slice(5, 7) - 1] + ' de ' + m.slice(0, 4) + (m === mesAtual ? ' (até hoje)' : '') + '</option>';
    });
    h += '</optgroup><optgroup label="Mais tempo">';
    var anos = {}; meses.forEach(function (m) { anos[m.slice(0, 4)] = 1; });
    Object.keys(anos).sort().reverse().forEach(function (a) {
      var parcial = a + '-01-01' < desde ? ' (desde ' + nomeMes(desde.slice(0, 7)) + ')' : a === hojeISO.slice(0, 4) ? ' (até hoje)' : '';
      h += '<option value="a:' + a + '">Ano de ' + a + parcial + '</option>';
    });
    h += '<option value="12m">Últimos 12 meses</option><option value="tudo">Tudo (desde ' + dt(desde) + ')</option>';
    h += '<option value="c">Escolher as datas…</option></optgroup>';
    $('f-periodo').innerHTML = h;
  })();

  function intervalo() {
    var p = est.per, t = p.split(':'), r;
    if (t[0] === 'm') r = { tipo: 'm', de: t[1] + '-01', ate: fimMes(t[1]), rot: nomeMes(t[1], 1) };
    else if (t[0] === 'a') r = { tipo: 'a', de: t[1] + '-01-01', ate: t[1] + '-12-31', rot: t[1] };
    else if (p === '12m') { var x = new Date(hoje.getFullYear(), hoje.getMonth() - 11, 1); r = { tipo: '12m', de: iso(x), ate: hojeISO, rot: 'últimos 12 meses' }; }
    else if (p === 'tudo') r = { tipo: 'tudo', de: desde, ate: hojeISO, rot: 'desde ' + dt(desde) };
    else r = { tipo: 'c', de: est.de, ate: est.ate, rot: dt(est.de).slice(0, 5) + ' a ' + dt(est.ate).slice(0, 5) };
    if (r.de < desde) r.de = desde;
    if (r.ate > hojeISO) r.ate = hojeISO;
    return r;
  }
  // período anterior para comparar: mês atual x mês passado até o mesmo dia; senão, o mesmo tamanho logo antes
  function anterior(iv) {
    var r;
    if (iv.tipo === 'm') {
      var m = iv.de.slice(0, 7), d = new Date(+m.slice(0, 4), +m.slice(5, 7) - 2, 1), pm = iso(d).slice(0, 7);
      var ate = iv.ate.slice(0, 7) === mesAtual ? pm + '-' + hojeISO.slice(8, 10) : fimMes(pm);
      if (ate > fimMes(pm)) ate = fimMes(pm);
      r = { de: pm + '-01', ate: ate, rot: iv.ate.slice(0, 7) === mesAtual ? nomeMes(pm) + ' até o dia ' + +hojeISO.slice(8, 10) : nomeMes(pm, 1) };
    } else {
      var tam = Math.round((new Date(iv.ate) - new Date(iv.de)) / 864e5) + 1;
      r = { de: somaDias(iv.de, -tam), ate: somaDias(iv.de, -1), rot: 'os ' + tam + ' dias antes' };
    }
    return r.de >= desde ? r : null;
  }
  function noPeriodo(iv) { return function (v) { return v.d >= iv.de && v.d <= iv.ate; }; }

  // filtro do topo: unidade e "empresa de convênio" (o convênio está ligado a uma empresa no cadastro do EVO)
  function filtrados() {
    var u = est.unidade, e = est.empresa;
    function ok(x) { return (!u || x.unidade === u) && (!e || (e === 'com' ? !!x.emp : !x.emp)); }
    return { alunos: D.alunos.filter(ok), vendas: D.vendas.filter(ok) };
  }
  function seloEmp(c) {
    if (!c.empresa) return '';
    return '<span class="selo emp' + (c.empParcial ? ' parcial' : '') + '" title="' + (c.empParcial ? 'Ligado a esta empresa só em parte das unidades' : 'Empresa de convênio cadastrada no EVO') + '">🏢 ' + esc(c.empresa) + '</span>';
  }

  // resumo por convênio de uma lista de alunos e vendas
  function porConvenio(alunos, vendas, iv) {
    var r = {}, dentro = noPeriodo(iv);
    function pega(k) {
      return r[k] || (r[k] = { k: k, nome: nomeConv(k), alunos: 0, per: 0, perAtivos: 0, perSaiu: 0, ultima: null, primeira: null, unid: {}, unidVendas: {}, valor: 0, emps: {}, semEmp: 0, convs: {} });
    }
    function marca(c, x) { if (x.emp) c.emps[x.emp] = (c.emps[x.emp] || 0) + 1; else c.semEmp++; if (x.convOrig) c.convs[nomeConv(x.convOrig)] = 1; }
    alunos.forEach(function (a) { var c = pega(a.conv); marca(c, a); c.alunos++; c.unid[a.unidade] = (c.unid[a.unidade] || 0) + 1; c.valor += a.valor || 0; });
    vendas.forEach(function (v) {
      var c = pega(v.conv); marca(c, v);
      if (dentro(v)) { c.per++; if (ativoHoje(v)) c.perAtivos++; if (saiu(v)) c.perSaiu++; c.unidVendas[v.unidade] = (c.unidVendas[v.unidade] || 0) + 1; }
      if (!c.ultima || v.d > c.ultima) c.ultima = v.d;
      if (!c.primeira || v.d < c.primeira) c.primeira = v.d;
    });
    return Object.keys(r).map(function (k) {
      var c = r[k]; c.diasSem = dias(c.ultima); c.parado = c.diasSem != null && c.diasSem >= D.diasParado;
      c.ticket = c.alunos ? c.valor / c.alunos : 0;
      var es = Object.keys(c.emps).sort(function (a, b) { return c.emps[b] - c.emps[a]; });
      c.empresa = es[0] || ''; c.empParcial = !!(c.empresa && c.semEmp);
      return c;
    });
  }
  // agrupa por unidade: [{ unidade, alunos, vendas, convs: [...] }]
  function porUnidade(f, iv) {
    var g = {};
    f.alunos.forEach(function (a) { (g[a.unidade] = g[a.unidade] || { a: [], v: [] }).a.push(a); });

        var us = Object.keys(desc[k]); if (us.length < 2) return;
        var med = us.map(function (u) { var l = desc[k][u].sort(function (a, b) { return a - b; }); return { u: u, p: l[Math.floor(l.length / 2)] }; }).sort(function (a, b) { return b.p - a.p; });
        if (med[0].p - med[med.length - 1].p >= 5) dif.push({ k: k, a: nomeConv(k), b: med.map(function (m) { return m.u + ' ' + m.p + '%'; }).join(' · '), o: med[0].p - med[med.length - 1].p });
      });
      lista.push({ nivel: 'info', titulo: 'Desconto diferente entre unidades', val: dif.length,
        fazer: 'O mesmo convênio dá <b>desconto diferente</b> conforme a unidade (desconto mais comum dos alunos ativos). Conferir se é combinado ou cadastro errado.',
        itens: dif.sort(function (a, b) { return b.o - a.o; }) });
    }

    // 5. unidades sem venda de convênio nos últimos 30 dias (na rede)
    if (rede) {
      var uv = {};
      D.vendas.forEach(function (v) { var u = uv[v.unidade] = uv[v.unidade] || { ult: null, al: 0 }; if (!u.ult || v.d > u.ult) u.ult = v.d; });
      D.alunos.forEach(function (a) { if (uv[a.unidade]) uv[a.unidade].al++; });
      var semV = Object.keys(uv).filter(function (u) { return uv[u].ult < d30; })
        .map(function (u) { return { a: u, b: 'última em ' + dt(uv[u].ult) + ' · ' + n(uv[u].al) + ' alunos de convênio', o: uv[u].al }; }).sort(function (a, b) { return b.o - a.o; });
      lista.push({ nivel: 'warn', titulo: 'Unidades sem venda de convênio', val: semV.length,
        fazer: 'Já venderam convênio, mas <b>nada nos últimos 30 dias</b>. Cobrar a unidade e ver se há empresas perto para fechar novos convênios.',
        itens: semV });
    }

    // 6. convênios novos (1ª venda nos últimos 30 dias)
    var novos = cs.filter(function (c) { return c.primeira && c.primeira >= d30 && c.primeira > somaDias(desde, 30); })
      .map(function (c) { return { k: c.k, a: c.nome, b: '1ª venda em ' + dt(c.primeira) + ' · ' + n(c.alunos) + ' alunos', o: c.alunos }; }).sort(function (a, b) { return b.o - a.o; });
    lista.push({ nivel: 'ok', titulo: 'Convênios novos', val: novos.length,
      fazer: '1ª venda nos últimos 30 dias. <b>Aproveitar o começo</b>: material para o RH divulgar e acompanhar as primeiras semanas.',
      itens: novos });
    return lista;
  }
  function abaAvisos() {
    var lista = avisos();
    var html = '<p class="nota" style="margin:0 0 14px">Os avisos olham para hoje (não mudam com o período escolhido). ' + (est.unidade ? 'Filtrado para ' + esc(est.unidade) + '.' : 'Rede inteira; escolha uma unidade no topo para ver só ela.') + ' Clique num convênio para abrir a ficha.</p><div class="avisos">';
    lista.forEach(function (a) {
      var nivel = a.val ? a.nivel : 'ok';
      html += '<div class="av ' + nivel + '"><div class="av-topo"><span class="val num">' + n(a.val) + '</span><h3>' + esc(a.titulo) + '</h3></div>' +
        '<p class="fazer">' + (a.val ? a.fazer : 'Tudo certo por aqui.') + '</p>' +
        (a.itens.length ? '<ul>' + a.itens.slice(0, 8).map(function (i) {
          return '<li' + (i.k ? ' class="clica" data-k="' + esc(i.k) + '"' : '') + '><span>' + esc(i.a) + '</span><span>' + esc(i.b) + '</span></li>';
        }).join('') + '</ul>' + (a.itens.length > 8 ? '<div class="mais">+ ' + (a.itens.length - 8) + ' outros</div>' : '') : '') + '</div>';
    });
    $('conteudo').innerHTML = html + '</div>';
    document.querySelectorAll('.av li.clica').forEach(function (li) { li.onclick = function () { abrirFicha(li.dataset.k); }; });
  }
  function contarAvisos() {
    var q = avisos().filter(function (a) { return a.val && (a.nivel === 'crit' || a.nivel === 'warn'); }).length;
    $('abas').querySelector('[data-aba=avisos]').innerHTML = 'Avisos' + (q ? '<span class="qtd">' + q + '</span>' : '');
  }

  // ---------- ficha do convênio
  function abaFicha() {
    var iv = intervalo(), k = est.conv, c = D.convenios[k] || { nome: k, unidades: [] };
    var f = filtrados();
    var al = f.alunos.filter(function (a) { return a.conv === k && (!est.busca || norm(a.nome).indexOf(norm(est.busca)) >= 0); })
      .sort(function (a, b) { return a.nome.localeCompare(b.nome, 'pt-BR'); });
    var vs = f.vendas.filter(function (v) { return v.conv === k; });
    var vsPer = vs.filter(noPeriodo(iv));
    var ult = vs.length ? vs[0].d : null, ds = dias(ult);
    var parado = ds != null && ds >= D.diasParado;
    var porU = {}; al.forEach(function (a) { porU[a.unidade] = (porU[a.unidade] || 0) + 1; });
    $('conteudo').innerHTML =
      '<div class="ficha-topo"><button class="botao" id="voltar">← Voltar</button><h2>' + esc(c.nome) + '</h2>' + seloEmp(porConvenio(al, vs, iv)[0] || {}) +
      (parado ? '<span class="selo parado">■ Parado · ' + ds + ' dias sem venda nova</span>' : ult ? '<span class="selo ok">● Vendendo</span>' : '') +
      '<button class="botao prim" id="csv" style="margin-left:auto">Baixar lista de alunos (Excel)</button></div>' +
      '<section class="kpis">' +
      '<div class="kpi"><div class="rot">Alunos ativos</div><div class="val num">' + n(al.length) + '</div><div class="sub">' + (est.unidade ? esc(est.unidade) : 'cadastrado em ' + c.unidades.length + ' unidade(s)') + '</div></div>' +
      '<div class="kpi"><div class="rot">Vendas novas · ' + esc(iv.rot) + '</div><div class="val num">' + n(vsPer.length) + '</div><div class="sub">' + n(vsPer.filter(ativoHoje).length) + ' ainda ativos · ' + n(vs.length) + ' desde ' + dt(desde) + '</div></div>' +
      '<div class="kpi"><div class="rot">Última venda nova</div><div class="val num">' + (ult ? dt(ult).slice(0, 5) : '–') + '</div><div class="sub">' + (ult ? 'há ' + ds + ' dias' : 'sem venda nova no período') + '</div></div>' +
      '<div class="kpi"><div class="rot">Valor médio do plano</div><div class="val num">' + (al.length ? reais(al.reduce(function (s, a) { return s + (a.valor || 0); }, 0) / al.length) : '–') + '</div><div class="sub">dos alunos ativos</div></div>' +
      '</section><div style="height:16px"></div>' +
      (!est.unidade && Object.keys(porU).length > 1 ? '<div class="cartao"><h2>Alunos ativos por unidade</h2><p style="margin:0">' + quebraUnid(porU) + '</p></div>' : '') +
      '<div class="cartao"><h2>Vendas novas por mês<small>clique numa barra para ver o mês</small></h2>' + grafico(contarMeses(vs)) + '</div>' +
      '<div class="cartao"><h2>Alunos ativos<small>' + n(al.length) + ' alunos</small></h2>' + tabela([
        { t: 'Aluno', f: function (a) { return esc(a.nome); } },
        { t: 'Celular', f: function (a) { return esc(a.cel || '–'); } },
        { t: 'Unidade', f: function (a) { return esc(a.unidade); } },
        { t: 'Plano', f: function (a) { return esc(a.plano); } },
        { t: 'Valor do plano', n: 1, f: function (a) { return reais(a.valor); } },
        { t: 'Desconto', n: 1, f: function (a) { return a.desconto ? reais(a.desconto) : '–'; } },
        { t: 'Início', f: function (a) { return dt(a.inicio); } },
        { t: 'Fim', f: function (a) { return dt(a.fim); } }
      ], al) + '</div>' +
      '<div class="cartao"><h2>Vendas novas · ' + esc(iv.rot) + '<small>' + n(vsPer.length) + ' vendas · troque o período no topo</small></h2>' + tabelaVendas(vsPer) + '</div>';
    $('voltar').onclick = function () { trocar(est.voltar || 'ativos'); };
    $('csv').onclick = function () { baixarCsv('Alunos convênio ' + c.nome, [['Aluno', 'Celular', 'Unidade', 'Plano', 'Valor do plano', 'Desconto', 'Início', 'Fim', 'Convênio']].concat(al.map(function (a) {
      return [a.nome, a.cel, a.unidade, a.plano, dinheiro(a.valor), dinheiro(a.desconto), dt(a.inicio), dt(a.fim), c.nome];
    }))); };
    document.querySelectorAll('.grafico .col').forEach(function (col) { col.onclick = function () { mudarPeriodo('m:' + col.dataset.mes); }; });
    ligarDicas();
  }
  function dinheiro(v) { return (v || 0).toFixed(2).replace('.', ','); }
  function baixarVendas(vs, iv) {
    baixarCsv('Vendas convênios ' + (est.unidade || 'rede') + ' ' + iv.de + ' a ' + iv.ate, [['Data', 'Aluno', 'Ativo hoje', 'Convênio', 'Empresa do convênio', 'Unidade', 'Plano', 'Valor', 'Desconto', 'Consultor']].concat(vs.map(function (v) {
      return [dt(v.d), v.cliente, ativoHoje(v) ? 'Sim' : ativoHoje(v) === null ? 'Pré-venda' : 'Não', nomeConv(v.convOrig || v.conv), v.emp || '', v.unidade, v.plano, dinheiro(v.valor), dinheiro(v.desconto), v.consultor];
    })));
  }
  function baixarCsv(nome, linhas) {
    var csv = '﻿' + linhas.map(function (l) { return l.map(function (x) { x = String(x == null ? '' : x); return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(';'); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = nome.replace(/[\\/:*?"<>|]/g, '') + '.csv';
    a.click();
  }

  // ---------- interação
  function abrirFicha(k) { est.voltar = est.aba; est.conv = k; est.busca = ''; $('f-busca').value = ''; trocar('ficha'); }
  function ligar() {
    document.querySelectorAll('tr.clica').forEach(function (tr) { tr.onclick = function () { abrirFicha(tr.dataset.k); }; });
    document.querySelectorAll('tr.abre').forEach(function (tr) {
      tr.onclick = function () { est.aberto = est.aberto === tr.dataset.chave ? null : tr.dataset.chave; desenhar(true); };
    });
    document.querySelectorAll('[data-ficha]').forEach(function (b) { b.onclick = function (e) { e.stopPropagation(); abrirFicha(b.dataset.ficha); }; });
    document.querySelectorAll('#visao button').forEach(function (b) { b.onclick = function () { est.visao = b.dataset.v; est.aberto = null; desenhar(); }; });
    document.querySelectorAll('th[data-campo]').forEach(function (th) {
      if (!th.dataset.campo) return;
      th.onclick = function () {
        var c = th.dataset.campo;
        est.ord = { campo: c, desc: est.ord.campo === c ? !est.ord.desc : c !== 'nome' };
        desenhar(true);
      };
    });
    ligarDicas();
  }
  function ligarDicas() {
    var dica = $('dica');
    document.querySelectorAll('[data-dica]').forEach(function (el) {
      el.onmousemove = function (e) { dica.textContent = el.dataset.dica; dica.style.display = 'block'; dica.style.left = (e.clientX + 12) + 'px'; dica.style.top = (e.clientY - 34) + 'px'; };
      el.onmouseleave = function () { dica.style.display = 'none'; };
    });
  }
  function desenhar(manterRolagem) {
    var y = window.scrollY;
    kpis();
    ({ avisos: abaAvisos, ativos: abaAtivos, vendas: abaVendas, ficha: abaFicha })[est.aba]();
    window.scrollTo(0, manterRolagem ? y : 0);
  }
  function trocar(aba) {
    est.aba = aba; est.aberto = null;
    $('aba-ficha').hidden = aba !== 'ficha';
    if (aba === 'ficha') $('aba-ficha').textContent = nomeConv(est.conv) || 'Ficha';
    document.querySelectorAll('#abas button').forEach(function (b) { b.classList.toggle('ativa', b.dataset.aba === aba); });
    desenhar();
  }
  function mudarPeriodo(p) {
    est.per = p; $('f-periodo').value = p;
    $('f-datas').hidden = p !== 'c';
    if (p !== 'c') { var iv = intervalo(); est.de = iv.de; est.ate = iv.ate; $('f-de').value = iv.de; $('f-ate').value = iv.ate; }
    est.aberto = null;
    desenhar(true);
  }
  document.querySelectorAll('#abas button').forEach(function (b) { b.onclick = function () { trocar(b.dataset.aba); }; });
  $('f-unidade').onchange = function () { est.unidade = this.value; contarAvisos(); trocar(est.aba); };
  $('f-periodo').onchange = function () { mudarPeriodo(this.value); };
  $('f-empresa').onchange = function () { est.empresa = this.value; est.aberto = null; contarAvisos(); desenhar(true); };
  $('f-de').min = $('f-ate').min = desde; $('f-de').max = $('f-ate').max = hojeISO;
  $('f-de').onchange = $('f-ate').onchange = function () {
    if (!$('f-de').value || !$('f-ate').value) return;
    est.de = $('f-de').value; est.ate = $('f-ate').value;
    if (est.de > est.ate) { var t0 = est.de; est.de = est.ate; est.ate = t0; $('f-de').value = est.de; $('f-ate').value = est.ate; }
    desenhar(true);
  };
  var t;
  $('f-busca').oninput = function () {
    var v = this.value; clearTimeout(t);
    t = setTimeout(function () {
      est.busca = v.trim();
      // buscou um nome de aluno? abre a ficha do convênio dele
      if (est.busca.length >= 4 && est.aba === 'ativos' && !porConvenio(filtrados().alunos, [], intervalo()).some(buscaConv)) {
        var a = D.alunos.find(function (x) { return (!est.unidade || x.unidade === est.unidade) && norm(x.nome).indexOf(norm(est.busca)) >= 0; });
        if (a) { abrirFicha(a.conv); est.busca = v.trim(); $('f-busca').value = v; desenhar(); return; }
      }
      desenhar(true);
    }, 250);
  };
  mudarPeriodo(est.per);
  contarAvisos();
  trocar('ativos');
  // recarrega os dados a cada 30 min (o servidor atualiza de hora em hora)
  setTimeout(function () { location.reload(); }, 30 * 60000);
})();
</script>
</body>
</html>
