# Coleta GoVoice + EVO e publica as TVs no GitHub Pages, com os dados criptografados.
# Horários em UTC (Brasília = UTC-3): a cada 5 min das 6h à meia-noite, a cada 30 min de madrugada.
name: TVs
on:
  schedule:
    - cron: '*/5 9-23,0-2 * * *'
    - cron: '*/30 3-8 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # só o passo "Conferir se o site atualizou" grava (commit vazio que destrava o Pages)
  pages: write
  id-token: write

concurrency:
  group: tvs
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    env:
      TZ: America/Sao_Paulo
      CHAVE_TV: ${{ secrets.CHAVE_TV }}
      CHAVE_INTERNA: ${{ secrets.CHAVE_INTERNA }}
      CHAVE_DP: ${{ secrets.CHAVE_DP }}
      CHAVE_CONV: ${{ secrets.CHAVE_CONV }}
      UFIT_CONFIG: /tmp/ufit/config
      UFIT_ESTADO: /tmp/ufit/estado
      UFIT_CREDENCIAIS: /tmp/ufit/cred
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Abrir listas, estado e credenciais
        env:
          EVO_CRED: ${{ secrets.EVO_CRED }}
          GOVOICE_CRED: ${{ secrets.GOVOICE_CRED }}
        run: |
          mkdir -p /tmp/ufit/cred /tmp/ufit/saida
          node ferramentas/cripto.js desempacotar CHAVE_INTERNA config.enc "$UFIT_CONFIG"
          t=$(date +%s)
          # o cache do Pages ignora "?t=": pede o arquivo com letras em código (outro endereço no cache, mesmo arquivo)
          if curl -fsS "$SITE_URL/$(node ferramentas/cripto.js variar estado.enc)" -o /tmp/ufit/estado.enc \
             && node ferramentas/cripto.js desempacotar CHAVE_INTERNA /tmp/ufit/estado.enc "$UFIT_ESTADO"; then
            echo "estado: última coleta"
          else
            node ferramentas/cripto.js desempacotar CHAVE_INTERNA estado-inicial.enc "$UFIT_ESTADO"
            echo "estado: inicial"
          fi
          curl -fsS "$SITE_URL/$(node ferramentas/cripto.js variar conv.enc)" -o /tmp/ufit/conv-anterior.enc || echo "sem convênios anteriores"
          printf '%s' "$EVO_CRED" > "$UFIT_CREDENCIAIS/evo-api-credentials.json"
          printf '%s' "$GOVOICE_CRED" > "$UFIT_CREDENCIAIS/govoice-credentials.json"

      - name: Coletar
        working-directory: coletor
        run: python3 rodar_nuvem.py /tmp/ufit/saida

      - name: Montar o site (criptografado)
        if: always()
        run: |
          rm -rf /tmp/ufit/cred
          test -f /tmp/ufit/saida/dados.json || { echo "coleta falhou: o site anterior continua no ar"; exit 1; }
          mkdir -p public
          cp -r site/. public/
          node ferramentas/cripto.js cifrar CHAVE_TV /tmp/ufit/saida/dados.json public/dados.enc
          # aba Período da TV 2 (comissão): só abre com a senha do DP
          if [ -n "$CHAVE_DP" ] && [ -f /tmp/ufit/saida/dp.json ]; then
            node ferramentas/cripto.js cifrar CHAVE_DP /tmp/ufit/saida/dp.json public/dp.enc
          fi
          if [ -f /tmp/ufit/saida/conv.json ]; then
            node ferramentas/cripto.js cifrar CHAVE_CONV /tmp/ufit/saida/conv.json public/conv.enc
          elif [ -s /tmp/ufit/conv-anterior.enc ]; then
            # entre as coletas (1 por hora) republica o anterior, sempre fechado com a senha dos Convênios
            # (CHAVE_TV: só para o arquivo que ainda estava com a chave antiga, na virada de 09/11/2026)
            for c in CHAVE_CONV CHAVE_TV; do
              if node ferramentas/cripto.js decifrar "$c" /tmp/ufit/conv-anterior.enc /tmp/ufit/conv-aberto.json 2>/dev/null; then
                node ferramentas/cripto.js cifrar CHAVE_CONV /tmp/ufit/conv-aberto.json public/conv.enc
                break
              fi
            done
          fi
          node ferramentas/cripto.js empacotar CHAVE_INTERNA "$UFIT_ESTADO" public/estado.enc
          ls -la public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: publicar
        uses: actions/deploy-pages@v4

      # O deploy às vezes diz "sucesso" e o Pages segue servindo a versão velha (06/11 e 09/11/2026).
      # O que destrava é um commit novo: a coleta seguinte publica com outro SHA.
      - name: Conferir se o site atualizou
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MSG: 'Destrava o Pages (conferência automática)'
        run: |
          esperado=$(sha256sum public/dados.enc | cut -d' ' -f1)
          for i in $(seq 1 12); do
            no_ar=$(curl -fsS "$SITE_URL/$(node ferramentas/cripto.js variar dados.enc)" | sha256sum | cut -d' ' -f1)
            if [ "$no_ar" = "$esperado" ]; then echo "site atualizado (tentativa $i)"; exit 0; fi
            sleep 15
          done
          echo "::warning::O site continua com a versão antiga depois do deploy"
          # no máximo um commit de destrave a cada 20 min
          if [ "$(git log -1 --format=%s)" = "$MSG" ] && [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 1200 ]; then
            echo "destrave recente: aguardando"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -q -m "$MSG"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main || echo "::warning::não consegui enviar o destrave"
